version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: prsdb
      POSTGRES_USER: prsuser
      POSTGRES_PASSWORD: prssecret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prsuser -d prsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.15.2
    command: [
      "-path", "/migrations",
      "-database", "postgres://prsuser:prssecret@db:5432/prsdb?sslmode=disable",
      "up"
    ]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgres://prsuser:prssecret@db:5432/prsdb?sslmode=disable"
    depends_on:
      - db
      - migrate
    ports:
      - "8080:8080"
    volumes:
      - ./:/app:cached

volumes:
  db-data: